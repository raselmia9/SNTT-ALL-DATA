<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>?Ship Name? - Tank & ASTM 54B</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: none;
    padding: 6px;
    display: block;

    background:
        radial-gradient(ellipse at 15% 10%, rgba(0, 225, 255, .24), transparent 45%),
        radial-gradient(ellipse at 90% 90%, rgba(125, 70, 255, .28), transparent 45%),
        linear-gradient(135deg, #09152f, #142e59 48%, #071b37);

    background-attachment: fixed;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}

body::-webkit-scrollbar {
    display: none;
}

/* 3D Ship Title Card */
.main-title {
    position: relative;
    text-align: center;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: .5px;

    padding: 12px 8px;
    margin-bottom: 12px;
    border-radius: 14px;

    background: linear-gradient(
        145deg,
        #18c9a7 0%,
        #079b89 45%,
        #08705f 100%
    );

    border: 1px solid rgba(255,255,255,.45);

    box-shadow:
        0 7px 0 #064c48,
        0 10px 16px rgba(0,0,0,.36),
        inset 0 2px 2px rgba(255,255,255,.42),
        inset 0 -3px 5px rgba(0,0,0,.20);

    text-shadow: 0 2px 3px rgba(0,0,0,.25);
}

/* 3D ASTM Title Card */
.astm-title {
    position: relative;
    text-align: center;
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .5px;

    padding: 10px 8px;
    margin-top: 15px;
    margin-bottom: 12px;
    border-radius: 14px;

    background: linear-gradient(
        145deg,
        #ffbd59 0%,
        #f08b30 48%,
        #bc501a 100%
    );

    border: 1px solid rgba(255,255,255,.5);

    box-shadow:
        0 7px 0 #843713,
        0 10px 16px rgba(0,0,0,.35),
        inset 0 2px 2px rgba(255,255,255,.5),
        inset 0 -3px 5px rgba(0,0,0,.18);

    text-shadow: 0 2px 3px rgba(0,0,0,.28);
}

/* শুধুমাত্র প্রয়োজনীয় দুটি Grid Layout */
.grid-section,
.tank-grid {
    background: linear-gradient(
        145deg,
        rgba(255,255,255,.13),
        rgba(255,255,255,.045)
    );

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    padding: 9px 6px;
    border-radius: 12px;
    margin-bottom: 12px;

    display: grid;
    gap: 7px;

    border: 1px solid rgba(255,255,255,.18);

    box-shadow:
        0 7px 20px rgba(0,0,0,.23),
        inset 0 1px 1px rgba(255,255,255,.12);
}

/* Tank Grid */
.tank-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 5px;
}

/* ASTM and Summary Grid */
.grid-section {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.input-group {
    position: relative;
    min-width: 0;
    margin-top: 6px;
}

.input-field,
.output-field {
    display: block;
    width: 100%;
    min-width: 0;
    height: 38px;

    background: rgba(255,255,255,.96);
    border: 2px solid #3498db;
    border-radius: 8px;

    text-align: center;
    font-size: 12px;
    font-weight: bold;
    color: #20324b;

    outline: none;
    padding: 5px 2px 0;

    box-shadow:
        inset 0 2px 4px rgba(0,0,0,.07),
        0 2px 3px rgba(0,0,0,.12);

    scroll-margin: 0;
}

.input-field:focus {
    background: #fff;
    border-color: #2ecc71;
    box-shadow:
        0 0 0 2px rgba(46,204,113,.18),
        0 0 9px rgba(46,204,113,.45);
}

.output-field {
    background: rgba(231,238,245,.96);
    border-color: #aebdca;
    cursor: default;
}

.floating-label {
    position: absolute;
    top: -9px;
    left: 4px;
    z-index: 2;

    max-width: calc(100% - 8px);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;

    background: #152c49;
    color: #fff;
    font-size: 7.5px;
    font-weight: bold;

    padding: 1px 4px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,.3);
    line-height: 14px;

    box-shadow: 0 2px 4px rgba(0,0,0,.25);
}

@media (max-width: 360px) {
    body {
        padding: 4px;
    }

    .grid-section,
    .tank-grid {
        padding: 7px 4px;
        gap: 4px;
    }

    .input-field,
    .output-field {
        height: 36px;
        font-size: 11px;
    }

    .main-title {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="main-title" id="ship_title">?Ship Name?</div>

<div class="tank-grid" id="tankContainer"></div>

<div class="grid-section">
    <div class="input-group">
        <span class="floating-label">Total Dip</span>
        <input type="text" id="total_dip" class="output-field" readonly value="0">
    </div>

    <div class="input-group">
        <span class="floating-label">Total Liter</span>
        <input type="text" id="total_liter" class="output-field" readonly value="0">
    </div>
</div>

<div class="astm-title">ASTM 53B / 54B</div>

<div class="grid-section">
    <div class="input-group">
        <span class="floating-label">Temperature</span>
        <input type="number" id="temp" class="input-field" step="any" oninput="calcAll()">
    </div>

    <div class="input-group">
        <span class="floating-label">Observe Density</span>
        <input type="number" id="obsDensity" class="input-field" step="any" oninput="calcAll()">
    </div>

    <div class="input-group">
        <span class="floating-label">Density 15</span>
        <input type="text" id="den15" class="output-field" readonly>
    </div>

    <div class="input-group">
        <span class="floating-label">VCF</span>
        <input type="text" id="vcf" class="output-field" readonly>
    </div>

    <div class="input-group">
        <span class="floating-label">Volume</span>
        <input type="number" id="volume" class="input-field" step="any" oninput="calcAll()">
    </div>

    <div class="input-group">
        <span class="floating-label">Net Volume</span>
        <input type="text" id="netVolume" class="output-field" readonly>
    </div>

    <div class="input-group">
        <span class="floating-label">WCF</span>
        <input type="text" id="wcf" class="output-field" readonly>
    </div>

    <div class="input-group">
        <span class="floating-label">Liter</span>
        <input type="text" id="liter" class="output-field" readonly>
    </div>

    <div class="input-group">
        <span class="floating-label">M.T</span>
        <input type="text" id="mt" class="output-field" readonly>
    </div>

    <div class="input-group">
        <span class="floating-label">Barrels</span>
        <input type="text" id="barrels" class="output-field" readonly>
    </div>
</div>

<script>
let d = /*PUT_JSON_STRING_HERE*/

let t = ['p1', 's1', 'p2', 's2', 'p3', 's3', 'p4', 's4', 'p5', 's5'];

let activeTankCount = 10;
let isManualVolume = false;

const gVal = id => document.getElementById(id);
const setVal = (id, v) => gVal(id).value = v;

window.onload = () => {
    let activeTanks = t.slice(0, activeTankCount);

    gVal('tankContainer').innerHTML = activeTanks.map(x => `
        <div class="input-group">
            <span class="floating-label">${x.toUpperCase()} Dip</span>
            <input type="text" inputmode="numeric"
                id="${x}_dip" class="input-field"
                oninput="onDipChange()">
        </div>
        <div class="input-group">
            <span class="floating-label">${x.toUpperCase()} Liter</span>
            <input type="text" id="${x}_liter"
                class="output-field" readonly>
        </div>
    `).join('');

    gVal('volume').addEventListener('input', function() {
        isManualVolume = true;
        calcAll();
    });

    // ইচ্ছাকৃতভাবে scrollIntoView ব্যবহার করা হয়নি।
    calcAll();
};

const getL = (n, p, m) => {
    if (!n || m <= 0) return 0;

    let b = Math.floor(m / 10) * 10;
    let e = n[`${p}=${m}`];

    if (e !== undefined) return Math.round(parseFloat(e));

    let l = parseFloat(n[`${p}=${b}`]);
    let u = parseFloat(n[`${p}=${b + 10}`]);

    return isNaN(l) ? 0 :
        isNaN(u) ? Math.round(l) :
        Math.round(l + (((m - b) / 10) * (u - l)));
};

const gA = dn =>
    (dn < 770 ? 341.0957 :
        dn <= 788 ? 594.5418 :
        186.9696 + 0.48618 * dn) / (dn * dn);

function onDipChange() {
    isManualVolume = false;
    calcAll();
}

function calcAll() {
    let s = gVal('ship_title').innerText.trim();
    let td = 0, tl = 0;
    let activeTanks = t.slice(0, activeTankCount);

    activeTanks.forEach(x => {
        let k = x.toUpperCase();
        let elem = gVal(`${x}_dip`);
        let v = elem ? (parseFloat(elem.value) || 0) : 0;
        let l = getL(d?.[s]?.[k], k, v);

        if (gVal(`${x}_liter`)) {
            setVal(`${x}_liter`, l > 0 ? l : "");
        }

        td += v;
        tl += l;
    });

    setVal('total_dip', td);
    setVal('total_liter', tl);

    if (!isManualVolume) {
        setVal('volume', tl > 0 ? tl : "");
    }

    let temp = parseFloat(gVal('temp').value);
    let oD = parseFloat(gVal('obsDensity').value);
    let vol = parseFloat(gVal('volume').value);

    if (isNaN(temp) || isNaN(oD)) {
        return ['den15', 'vcf', 'netVolume', 'wcf', 'liter', 'mt', 'barrels']
            .forEach(id => setVal(id, ''));
    }

    let dt = temp - 15;
    let rem = oD % 1;

    let obsD =
        Math.abs(rem - 0.25) < 0.001 ? Math.floor(oD) :
        Math.abs(rem - 0.75) < 0.001 ? Math.ceil(oD) :
        Math.round(oD * 2) / 2;

    let alpha_glass = 0.000023;
    let beta_glass = 0.000000002;
    let hydD = obsD * (1 - alpha_glass * dt - beta_glass * dt * dt);
    let d15 = hydD;

    for (let i = 0; i < 25; i++) {
        let alpha = gA(d15);
        let VCF_iter = Math.exp(-alpha * dt * (1 + 0.8 * alpha * dt));
        d15 = hydD / VCF_iter;
    }

    let rD15 = Math.round(d15 * 10) / 10;
    let finalAlpha = gA(rD15);
    let rawVcf = Math.exp(-finalAlpha * dt * (1 + 0.8 * finalAlpha * dt));

    if (rawVcf <= 0 || isNaN(rawVcf)) return;

    let vcf = parseFloat(rawVcf.toFixed(4));

    setVal('den15', rD15.toFixed(1));
    setVal('vcf', vcf.toFixed(4));

    if (!isNaN(vol)) {
        let netV = vol * vcf;
        let wcf = rD15 - 1.1;
        let lit = netV * (wcf / 1000);

        setVal('netVolume', netV.toFixed(2));
        setVal('wcf', wcf.toFixed(1));
        setVal('liter', lit.toFixed(2));
        setVal('mt', (lit / 1000).toFixed(3));
        setVal('barrels', (netV / 158.987459).toFixed(2));
    } else {
        ['netVolume', 'wcf', 'liter', 'mt', 'barrels']
            .forEach(id => setVal(id, ''));
    }
}
</script>

</body>
</html>
