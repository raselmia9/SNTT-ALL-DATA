<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAT 01 - Tank & ASTM 54B</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
        body{background:#8e44ad;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:10px;overflow-y:auto}
        .container{background:#8e44ad;width:100%;max-width:480px;padding:5px;padding-bottom:250px}
        .main-title,.astm-title{text-align:center;color:#fff;font-size:18px;font-weight:bold;background:#27ae60;padding:8px;border-radius:6px;margin-bottom:8px;border:2px solid #ffd700;box-shadow:0 0 8px rgba(255,215,0,.6)}
        .astm-title{background:#2980b9;font-size:15px;padding:6px;margin-top:12px}
        .grid-section,.tank-grid{background:#7f8c8d;padding:8px 6px;border-radius:6px;margin-bottom:8px;display:grid;gap:8px}
        /* এক লাইনে চারটি কলাম */
        .tank-grid{grid-template-columns:repeat(4, 1fr);gap:6px}
        .grid-section{grid-template-columns:1fr 1fr}
        .input-group{position:relative;margin-top:6px}
        .input-field,.output-field{width:100%;height:36px;background:#d1e8e2;border:2px solid #ffd700;box-shadow:0 0 4px rgba(255,215,0,.6);border-radius:6px;text-align:center;font-size:11px;font-weight:bold;color:#1a252f;outline:none;padding-top:4px}
        .input-field:focus{background:#e2f3ee;border-color:#ffea75;box-shadow:0 0 6px rgba(255,215,0,.9)}
        .output-field{cursor:not-allowed;display:flex;align-items:center;justify-content:center}
        .floating-label{position:absolute;top:-10px;left:3px;background:#7f8c8d;color:#fff;font-size:7.5px;font-weight:bold;padding:0 2px;border-radius:3px;border:1px solid #ffd700;line-height:16px}
    </style>
</head>
<body>

<div class="container">
    <div class="main-title" id="ship_title">BAT 01</div>
    
    <div class="tank-grid" id="tankContainer"></div>
    <div class="grid-section">
        <div class="input-group"><span class="floating-label">Total Dip</span><input type="text" id="total_dip" class="output-field" readonly value="0"></div>
        <div class="input-group"><span class="floating-label">Total Liter</span><input type="text" id="total_liter" class="output-field" readonly value="0"></div>
    </div>

    <div class="astm-title">ASTM 53B / 54B</div>
    <div class="grid-section">
        <div class="input-group"><span class="floating-label">Temperature</span><input type="number" id="temp" class="input-field" step="any" oninput="calcAll()"></div>
        <div class="input-group"><span class="floating-label">Observe Density</span><input type="number" id="obsDensity" class="input-field" step="any" oninput="calcAll()"></div>
        <div class="input-group"><span class="floating-label">Density 15</span><input type="text" id="den15" class="output-field" readonly></div>
        <div class="input-group"><span class="floating-label">VCF</span><input type="text" id="vcf" class="output-field" readonly></div>
        <div class="input-group"><span class="floating-label">Volume</span><input type="number" id="volume" class="input-field" step="any" oninput="calcAll()"></div>
        <div class="input-group"><span class="floating-label">Net Volume</span><input type="text" id="netVolume" class="output-field" readonly></div>
        <div class="input-group"><span class="floating-label">WCF</span><input type="text" id="wcf" class="output-field" readonly></div>
        <div class="input-group"><span class="floating-label">Liter</span><input type="text" id="liter" class="output-field" readonly></div>
        <div class="input-group"><span class="floating-label">M.T</span><input type="text" id="mt" class="output-field" readonly></div>
        <div class="input-group"><span class="floating-label">Barrels</span><input type="text" id="barrels" class="output-field" readonly></div>
    </div>
</div>

<script>
    // অ্যাপ ইনভেন্টরে `/*PUT_JSON_STRING_HERE*/` অংশটি TinyDB থেকে পাওয়া জেসন স্ট্রিং দিয়ে রিপ্লেস করবেন
    let rawJson = '/*PUT_JSON_STRING_HERE*/';
    
    let d = {};
    try {
        d = JSON.parse(rawJson);
    } catch(e) {
        // ফলব্যাক হিসেবে ডিফল্ট ডাটা যাতে লেআউট ভেঙে না যায়
        d = {
            "BAT 01": {
                "P1": { "0": "0", "10": "1000" }, "S1": { "0": "0", "10": "1000" },
                "P2": { "0": "0", "10": "1000" }, "S2": { "0": "0", "10": "1000" },
                "P3": { "0": "0", "10": "1000" }, "S3": { "0": "0", "10": "1000" },
                "P4": { "0": "0", "10": "1000" }, "S4": { "0": "0", "10": "1000" },
                "P5": { "0": "0", "10": "1000" }, "S5": { "0": "0", "10": "1000" }
            }
        };
    }

    let t = ['p1', 's1', 'p2', 's2', 'p3', 's3', 'p4', 's4', 'p5', 's5'];
    
    // এখান থেকে আপনি কয়টি ট্যাংক দেখতে চান তা ম্যানুয়ালি পরিবর্তন করতে পারবেন (যেমন: 6, 8 বা 10)
    let activeTankCount = 10; 

    let isManualVolume = false;

    const gVal = id => document.getElementById(id), setVal = (id, v) => gVal(id).value = v;

    window.onload = () => {
        let activeTanks = t.slice(0, activeTankCount);
        tankContainer.innerHTML = activeTanks.map(x => `
            <div class="input-group"><span class="floating-label">${x.toUpperCase()} Dip</span><input type="text" inputmode="numeric" id="${x}_dip" class="input-field" oninput="onDipChange()"></div>
            <div class="input-group"><span class="floating-label">${x.toUpperCase()} Lit</span><input type="text" id="${x}_liter" class="output-field" readonly></div>
        `).join('');

        document.getElementById('volume').addEventListener('input', function() {
            isManualVolume = true;
            calcAll();
        });

        document.querySelectorAll('.input-field').forEach(element => {
            element.addEventListener('focus', function() {
                setTimeout(() => {
                    this.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            });
        });

        calcAll();
    };

    const getL = (n, p, m) => {
        if (!n || m <= 0) return 0;
        let b = Math.floor(m / 10) * 10, e = n[`${p}=${m}`];
        if (e !== undefined) return Math.round(parseFloat(e));
        let l = parseFloat(n[`${p}=${b}`]), u = parseFloat(n[`${p}=${b + 10}`]);
        return isNaN(l) ? 0 : isNaN(u) ? Math.round(l) : Math.round(l + (((m - b) / 10) * (u - l)));
    };

    const gA = dn => (dn < 770 ? 341.0957 : dn <= 788 ? 594.5418 : 186.9696 + 0.48618 * dn) / (dn * dn);

    function onDipChange() {
        isManualVolume = false;
        calcAll();
    }

    function calcAll() {
        let s = ship_title.innerText.trim(), td = 0, tl = 0;
        let activeTanks = t.slice(0, activeTankCount);

        activeTanks.forEach(x => {
            let k = x.toUpperCase(), elem = gVal(`${x}_dip`);
            let v = elem ? (parseFloat(elem.value) || 0) : 0;
            let l = getL(d?.[s]?.[k], k, v);
            if(gVal(`${x}_liter`)) setVal(`${x}_liter`, l > 0 ? l : "");
            td += v; tl += l;
        });
        
        setVal('total_dip', td);
        setVal('total_liter', tl);

        if (!isManualVolume) {
            setVal('volume', tl > 0 ? tl : "");
        }

        let temp = parseFloat(gVal('temp').value), 
            oD = parseFloat(gVal('obsDensity').value), 
            vol = parseFloat(gVal('volume').value);

        if (isNaN(temp) || isNaN(oD)) return ['den15','vcf','netVolume','wcf','liter','mt','barrels'].forEach(id => setVal(id, ''));

        let dt = temp - 15, rem = oD % 1;
        let obsD = Math.abs(rem - 0.25) < 0.001 ? Math.floor(oD) : Math.abs(rem - 0.75) < 0.001 ? Math.ceil(oD) : Math.round(oD * 2) / 2;
        
        let alpha_glass = 0.000023, beta_glass = 0.000000002;
        let hydD = obsD * (1 - alpha_glass * dt - beta_glass * dt * dt), d15 = hydD;
        
        for (let i = 0; i < 25; i++) {
            let alpha = gA(d15);
            let VCF_iter = Math.exp(-alpha * dt * (1 + 0.8 * alpha * dt));
            d15 = hydD / VCF_iter;
        }

        let rD15 = Math.round(d15 * 10) / 10;
        let finalAlpha = gA(rD15);
        
        let rawVcf = Math.exp(-finalAlpha * dt * (1 + 0.8 * finalAlpha * dt));
        if (rawVcf <= 0 || isNaN(rawVcf)) return;

        let vcf = parseFloat(rawVcf.toFixed(4)); 

        setVal('den15', rD15.toFixed(1));
        setVal('vcf', vcf.toFixed(4));

        if (!isNaN(vol)) {
            let netV = vol * vcf; 
            let wcf = rD15 - 1.1; 
            let lit = netV * (wcf / 1000);
            
            setVal('netVolume', netV.toFixed(2));
            setVal('wcf', wcf.toFixed(1));
            setVal('liter', lit.toFixed(2));
            setVal('mt', (lit / 1000).toFixed(3));
            setVal('barrels', (netV / 158.987459).toFixed(2));
        } else {
            ['netVolume','wcf','liter','mt','barrels'].forEach(id => setVal(id, ''));
        }
    }
</script>

</body>
</html>
