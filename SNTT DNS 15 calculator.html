<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNTT DNS 15 - ASTM 53B / 54B</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            padding: 10px 15px 20px 15px; /* উপরে অল্প ফাঁকা রাখা হয়েছে */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .title {
            text-align: center;
            color: #2b2b2b;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .grid-section {
            background-color: #7f8c8d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .card-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card-label {
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            text-align: center;
        }
        .input-field, .output-field {
            width: 100%;
            height: 40px;
            background-color: #d1e8e2;
            border: 1px solid #a0c4b8;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #1a252f;
            outline: none;
        }
        .input-field:focus {
            background-color: #e2f3ee;
            border-color: #3498db;
        }
        .output-field {
            background-color: #d1e8e2;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">ASTM 53B / 54B</div>

    <!-- ইনপুট ফিল্ড -->
    <div class="grid-section">
        <div class="card-box">
            <div class="card-label">Temperature</div>
            <input type="number" id="temp" class="input-field" step="any" placeholder="" oninput="autoCalculate()">
        </div>
        <div class="card-box">
            <div class="card-label">Observe Density</div>
            <input type="number" id="obsDensity" class="input-field" step="any" placeholder="" oninput="autoCalculate()">
        </div>
    </div>

    <!-- ফলাফল ও অতিরিক্ত ইনপুট ফিল্ড -->
    <div class="grid-section">
        <div class="card-box">
            <div class="card-label">Volume</div>
            <input type="number" id="volume" class="input-field" step="any" placeholder="" oninput="autoCalculate()">
        </div>
        <div class="card-box">
            <div class="card-label">Density 15</div>
            <input type="text" id="den15" class="output-field" readonly>
        </div>

        <div class="card-box">
            <div class="card-label">VCF</div>
            <input type="text" id="vcf" class="output-field" readonly>
        </div>
        <div class="card-box">
            <div class="card-label">Net Volume</div>
            <input type="text" id="netVolume" class="output-field" readonly>
        </div>

        <div class="card-box">
            <div class="card-label">WCF</div>
            <input type="text" id="wcf" class="output-field" readonly>
        </div>
        <div class="card-box">
            <div class="card-label">Liter</div>
            <input type="text" id="liter" class="output-field" readonly>
        </div>

        <div class="card-box">
            <div class="card-label">M.T</div>
            <input type="text" id="mt" class="output-field" readonly>
        </div>
        <div class="card-box">
            <div class="card-label">Barrels</div>
            <input type="text" id="barrels" class="output-field" readonly>
        </div>
    </div>
</div>

<script>
// ASTM D1250 Multi-Range Equation Constants Adjustment
function getAlpha15(den15) {
    let K0, K1;
    if (den15 < 770.0) {
        K0 = 341.0957;
        K1 = 0.0;
    } else if (den15 <= 788.0) {
        K0 = 594.5418;
        K1 = 0.0;
    } else {
        K0 = 186.9696;
        K1 = 0.48618;
    }
    return (K0 + K1 * den15) / (den15 * den15);
}

function clearOutputs() {
    document.getElementById('den15').value = "";
    document.getElementById('vcf').value = "";
    document.getElementById('netVolume').value = "";
    document.getElementById('wcf').value = "";
    document.getElementById('liter').value = "";
    document.getElementById('mt').value = "";
    document.getElementById('barrels').value = "";
}

function autoCalculate() {
    let tempStr = document.getElementById('temp').value.trim();
    let obsDensityStr = document.getElementById('obsDensity').value.trim();
    let volumeStr = document.getElementById('volume').value.trim();

    // ডিজিট লেংথ শর্ত (Temp >= 2, Density >= 3)
    if (tempStr.length < 2 || obsDensityStr.length < 3) {
        clearOutputs();
        return;
    }

    let temp = parseFloat(tempStr);
    let rawObsDensity = parseFloat(obsDensityStr);

    if (isNaN(temp) || isNaN(rawObsDensity)) {
        clearOutputs();
        return;
    }

    // ASTM D1250 লজিক (.25 & .75 Step Rounding)
    let dt = temp - 15.0;
    let obsDensity;
    let rem = rawObsDensity % 1.0;

    if (Math.abs(rem - 0.25) < 0.001) {
        obsDensity = Math.floor(rawObsDensity);
    } else if (Math.abs(rem - 0.75) < 0.001) {
        obsDensity = Math.ceil(rawObsDensity);
    } else {
        obsDensity = Math.round(rawObsDensity * 2) / 2;
    }

    // কাচ কারেকশন (HYC)
    let hyc = 1.0 - 0.000023 * dt - 0.000000002 * (dt * dt);
    let hydDensity = obsDensity * hyc;

    // Density at 15°C Iteration
    let den15 = hydDensity;
    for (let i = 0; i < 15; i++) {
        let alpha = getAlpha15(den15);
        let vcf_temp = Math.exp(-alpha * dt * (1.0 + 0.8 * alpha * dt));
        den15 = hydDensity / vcf_temp;
    }

    let roundedDen15 = Math.round(den15 * 10) / 10;

    // VCF Calculation
    let alpha15 = getAlpha15(roundedDen15);
    let vcf = Math.exp(-alpha15 * dt * (1.0 + 0.8 * alpha15 * dt));

    // আউটপুট: VCF ৪ দশমিক ঘর পর্যন্ত সেট করা হয়েছে (0.xxxx)
    document.getElementById('den15').value = roundedDen15.toFixed(1);
    document.getElementById('vcf').value = vcf.toFixed(4);

    // ভলিউম সাপেক্ষে অন্যান্য আউটপুট
    if (volumeStr !== "" && !isNaN(parseFloat(volumeStr))) {
        let volume = parseFloat(volumeStr);

        let netVol = volume * vcf;
        document.getElementById('netVolume').value = netVol.toFixed(2);

        let wcfVal = roundedDen15 - 1.1;
        document.getElementById('wcf').value = wcfVal.toFixed(1);

        let literVal = netVol * (wcfVal / 1000);
        document.getElementById('liter').value = literVal.toFixed(2);

        let mtVal = literVal / 1000;
        document.getElementById('mt').value = mtVal.toFixed(3);

        let barrelsVal = netVol / 158.9873;
        document.getElementById('barrels').value = barrelsVal.toFixed(2);

    } else {
        document.getElementById('netVolume').value = "";
        document.getElementById('wcf').value = "";
        document.getElementById('liter').value = "";
        document.getElementById('mt').value = "";
        document.getElementById('barrels').value = "";
    }
}
</script>

</body>
    </html>
