/* ===== MOVIE SECTION (from Movie UI) ===== */

:root {
  --bg:#090d16;
  --card:#151c2b;
  --surface:#1c2638;
  --accent:#e50935;
  --green:#20d68a;
  --text:#f5f7fc;
  --muted:#98a5b9;
  --columns:3;
}

.content *, .modal * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }


/* CONTENT */

.content {
  padding:12px 12px 35px;
}

.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:5px 3px 14px;
}

.section-title h2 {font-size:15px; font-weight:800;}

.header-view-buttons {
  display:flex;
  gap:5px;
}

.view-icon-btn {
  padding:5px 9px;
  border-radius:6px;
  background:#1c2638;
  border:1px solid #2c3a50;
  color:#b7c1d1;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.view-icon-btn.active {
  background:#147d50;
  color:white;
  border-color:#20d68a;
}

/* MOVIE GRID */

.movie-grid {
  display:grid;
  grid-template-columns:repeat(var(--columns),minmax(0,1fr));
  gap:12px 9px;
}

.movie-card {
  min-width:0;
  cursor:pointer;
}

.poster {
  position:relative;
  width:100%;
  aspect-ratio:2/3;
  overflow:hidden;
  border-radius:9px;
  background:#202b3c;
  border:1px solid #29354a;
}

.poster img {
  width:100%;
  height:100%;
  object-fit: cover;
  object-position: center; /* ইমেজের সেন্টার অংশ ফিক্সড রাখবে */
  display:block;
}

.poster-overlay {
  position:absolute;
  inset:45% 0 0;
  background:linear-gradient(transparent,rgba(0,0,0,.8));
}

.play-icon {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:36px;
  height:36px;
  border-radius:50%;
  background:rgba(229,9,53,.9);
  display:grid;
  place-items:center;
  font-size:14px;
  opacity:0;
}

.movie-card:active .play-icon {opacity:1}

.quality-tag {
  position:absolute;
  top:6px;
  left:5px;
  background:rgba(0,0,0,.8);
  color:white;
  padding:4px 6px;
  font-size:8px;
  border-radius:4px;
}

.movie-info {padding:6px 2px 0}

.movie-title {
  font-size:11px;
  font-weight:bold;
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:30px;
}

.movie-desc {
  display: none; /* Hidden in Grid View */
}

.movie-date {
  font-size:9px;
  color:var(--muted);
  margin-top:3px;
}

/* LIST VIEW */

.movie-grid.list-view {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.list-view .movie-card {
  display:flex;
  align-items:center;
  width:100%;
  gap:12px;
  padding:8px 10px;
  background:var(--card);
  border:1px solid #29364b;
  border-radius:8px;
}

.list-view .poster {
  width:75px; 
  min-width:75px;
  height:72px;
  aspect-ratio:unset;
  border-radius:6px;
}

.list-view .poster img {
  width:100%;
  height:100%;
  object-fit: cover;
  object-position: center; /* লিস্ট ভিউতেও ইমেজের সেন্টার ফিক্সড রাখবে */
}

.list-view .movie-info {
  flex:1;
  padding:0;
  min-width:0;
}

.list-view .movie-title {
  font-size:12px;
  min-height:auto;
  margin-bottom:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.list-view .movie-desc {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 9px;
  color: #a0aab8;
  margin-top: 1px;
  line-height: 1.3;
}

.list-view .movie-date {
  font-size: 8px;
  margin-top: 2px;
}

.list-view .poster-overlay,
.list-view .play-icon {
  display:none;
}

/* LOADING */

.loading,.empty {
  text-align:center;
  padding:35px 10px;
  color:var(--muted);
  font-size:12px;
}

.spinner {
  width:26px;
  height:26px;
  border:3px solid #344057;
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 10px;
}


/* DETAILS MODAL */

.modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.85);
  align-items:flex-start;
  justify-content:center;
  padding-top:10px;
  overflow:hidden;
  overscroll-behavior:contain;
  touch-action:pan-y;
}

.modal.show {display:flex}

.modal-box {
  width:88%;
  max-width:350px;
  max-height:85vh;
  max-height:85dvh;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  background:#121a29;
  border-radius:12px;
  border:1px solid #354158;
  padding:12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  animation:slideDown .2s ease;
  scrollbar-width:thin;
  scrollbar-color:#46556d #121a29;
}

.modal-box::-webkit-scrollbar {
  width:3px;
}

.modal-box::-webkit-scrollbar-thumb {
  background:#46556d;
  border-radius:10px;
}

@keyframes slideDown {
  from {transform:translateY(-100%)}
  to {transform:translateY(0)}
}

.modal-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  position:sticky;
  top:-12px;
  z-index:2;
  background:#121a29;
  padding:6px 0;
}

.modal-top h3 {font-size:13px; font-weight:700;}

.close {
  background:#283449;
  color:white;
  border:none;
  border-radius:50%;
  width:26px;
  height:26px;
  font-size:15px;
  display:grid;
  place-items:center;
  flex-shrink:0;
  cursor:pointer;
}

.detail-header {
  display:flex;
  gap:9px;
  margin-bottom:10px;
}

.detail-poster {
  width:75px;
  height:105px;
  flex-shrink:0;
  border-radius:6px;
  object-fit:cover;
  object-position: center;
  background:#283449;
}

.detail-info {min-width:0}

.detail-info h2 {
  font-size:12px;
  line-height:1.4;
  margin-bottom:4px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.detail-info p {
  font-size:9px;
  color:var(--muted);
  line-height:1.4;
}

.details-text {
  white-space:pre-line;
  color:#c0cada;
  font-size:10px;
  line-height:1.5;
  padding:8px 9px;
  border-radius:7px;
  background:#1a2537;
  margin-bottom:10px;
  max-height:90px;
  overflow-y:auto;
}

.option-title {
  font-size:10px;
  font-weight:bold;
  margin-bottom:6px;
  color:#a5c4b3;
}

.video-options {
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:8px;
}

.video-option {
  width:100%;
  padding:10px 11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#202c40;
  color:white;
  border:1px solid #34435c;
  border-radius:7px;
  text-align:left;
  font-size:10px;
  cursor:pointer;
}

.video-option:active {background:#394861}

.video-option span:last-child {
  color:#20d68a;
  font-weight:bold;
}

</style>
</head>

let lfeAllChannels = [];
let lfeCategories = new Set();
let lfeActiveCategory = "All";

async function initMultiPlaylists() {
    const sliderContainer = document.getElementById('lfeSliderContainer');
    
    if (sliderContainer) {
        sliderContainer.innerHTML = '<div style="color: #8b949e; font-size: 12px; padding: 10px;" id="lfeCountdownText">Checking live events (1.5s)...</div>';
    }

    let timeLeft = 15; 
    let countdownInterval = setInterval(() => {
        timeLeft--;
        let countText = document.getElementById('lfeCountdownText');
        if (countText && timeLeft > 0) {
            let secondsVal = (timeLeft / 10).toFixed(1);
            countText.innerText = `Checking live events (${secondsVal}s)...`;
        }
    }, 100);

    const targetPlaylists = [
       { url: "https://raw.githubusercontent.com/raselmia9/Fancodebd2/refs/heads/main/playlist.m3u", sourceName: "fancode" },
 


 { url: "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.m3u", sourceName: "willow" },
       { url: "https://raw.githubusercontent.com/srhady/SonyLiv/refs/heads/main/sonyliv_playlist.m3u", sourceName: "sonyliv" },
       { url: "https://gist.githubusercontent.com/albatr0ssss/3cff7a26be49b1d352c15f615067e7cd/raw/tapmad_bd.m3u", sourceName: "tapmad" },

     
 { url: "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/primevideo_sports.m3u", sourceName: "Primevide" }


    ];

    let allParsedChannels = [];

    let promises = targetPlaylists.map(async (item) => {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1500); 

            let res = await fetch(item.url, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (res.ok) {
                let text = await res.text();
                if (text && text.includes("#EXTINF")) {
                    return { text, sourceName: item.sourceName }; 
                }
            }
        } catch (e) {}
        
        return null; 
    });

    let results = await Promise.all(promises);
    clearInterval(countdownInterval);

    results.forEach(result => {
        if (result && result.text) {
            parseAndAddChannels(result.text, result.sourceName);
        }
    });

    lfeAllChannels = allParsedChannels;

    if (lfeAllChannels.length > 0) {
        renderLfeCategories();
        renderLfeSlider();
    } else {
        if (sliderContainer) {
            sliderContainer.innerHTML = '<div style="color: #8b949e; font-size: 12px; padding: 10px;">বর্তমানে কোনো লাইভ ইভেন্ট উপলব্ধ নেই</div>';
        }
    }

    function parseAndAddChannels(data, defaultSource) {
        const lines = data.split(/\r?\n/);
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].startsWith("#EXTINF")) {
                let lineStr = lines[i];
                let name = lineStr.split(',').pop().trim();
                let group = lineStr.includes('group-title="') ? lineStr.split('group-title="')[1].split('"')[0] : "Others";
                let logo = lineStr.match(/tvg-logo="(.*?)"/)?.[1] || '';
                
                let j = i + 1;
                let url = "", licenseKey = "", cookie = "", referer = "";

                while (j < lines.length && !lines[j].startsWith("#EXTINF")) {
                    let line = lines[j].trim();
                    if (line.startsWith("http")) url = line;
                    if (line.includes("license_key=")) licenseKey = line.split("license_key=")[1].trim();
                    if (line.includes("Edge-Cache-Cookie=")) cookie = line.split("Edge-Cache-Cookie=")[1].split(/[ "']/)[0];
                    if (line.includes("http-referrer=")) referer = line.split("http-referrer=")[1].split(/[ "']/)[0];
                    j++;
                }

                let finalOutput = url;
                if (cookie) finalOutput += `|Cookie=Edge-Cache-Cookie=${cookie}`;
                if (referer) finalOutput += `|Referer=${referer}`;
                if (licenseKey) finalOutput += `|drmScheme=clearkey&drmLicense=${licenseKey}`;

                if (url && url.trim() !== "") {
                    allParsedChannels.push({ name, url: finalOutput, logo, group, source: defaultSource });
                    lfeCategories.add(group);
                }
                i = j - 1;
            }
        }
    }
}

function renderLfeCategories() {
    const bar = document.getElementById('lfeCatContainer');
    if (!bar) return;
    
    const customOrder = ["Cricket", "Football"];
    let otherCats = Array.from(lfeCategories).filter(cat => !customOrder.includes(cat)).sort();
    let sortedCats = [...customOrder.filter(cat => lfeCategories.has(cat)), ...otherCats];

    bar.innerHTML = `<button class="cat-btn" onclick="window.lfeFilterCat('All')">All (${lfeAllChannels.length})</button>`;

        bar.innerHTML += `<button class="cat-btn" onclick="window.lfeFilterCat('${cat}')">${cat} (${count})</button>`;
    });

else if (source === 'prime' || source === 'amazon' || groupLower.includes('prime') || nameLower.includes('prime')) {

    lfeActiveCategory = cat;

function filterMatches(input) {
    currentSearch = input ? input.toLowerCase().trim() : '';

    const liveWrapper = document.getElementById('liveWrapper');
    const lfeWrapper = document.querySelector('.lfe-wrapper');

        if (lfeWrapper) lfeWrapper.style.display = 'block';
        if (categoryContainer) categoryContainer.style.display = 'flex';

    }

    applyMovieSearch(currentSearch);

function updateTimers() { 
    if (!showLiveSlider) return;
    
    const liveWrapper = document.getElementById('liveWrapper');
    let visibleCount = 0;

    document.querySelectorAll('#liveSliderContainer .card').forEach(card => { 
        let el = card.querySelector('.status');
        if (!el) return;

        let startStr = card.getAttribute('data-start');
        let start = new Date(startStr).getTime(); 
        let now = new Date().getTime(); 
        let diff = start - now; 
        let timerEl = el.querySelector('.timer'); 
        let dateObj = new Date(start); 
                         
        let league = card.querySelector('.league-header').innerText.toUpperCase(); 
        
        let maxDuration = 28800000; 
        if (league.includes('ODI')) maxDuration = 36000000; 
        else if (league.includes('TEST')) maxDuration = 432000000; 
        else if (!league.includes('TEST')) maxDuration = 10800000; 
         
        el.querySelector('.start-time').innerText = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true}); 
        el.querySelector('.start-date').innerText = dateObj.toLocaleDateString('en-GB'); 

        let elapsed = Math.abs(diff);
        let shouldHide = false;
        let hideBufferTime = 7200000; // ম্যাচ শেষ হওয়ার পর অতিরিক্ত ২ ঘণ্টা (7200000 ms) দৃশ্যমান থাকবে

        if (diff < 0) { 
            if (league.includes('TEST')) {
                let testDayDuration = 21600000; 
                let totalDayCycle = 86400000;  
                
                let currentDayNumber = Math.floor(elapsed / totalDayCycle) + 1;
                let daySessionMod = elapsed % totalDayCycle;

                if (currentDayNumber <= 5 && daySessionMod <= testDayDuration) {
                    timerEl.className = "timer text-red"; 
                    timerEl.innerHTML = `<div class="dot"></div> Day ${currentDayNumber} | Live Session`;
                } else {
                    timerEl.className = "timer text-orange"; 
                    timerEl.innerText = `Day ${Math.min(currentDayNumber, 5)} | Stumps / Break`;
                }

                if (elapsed > (432000000 + hideBufferTime)) { 
                    shouldHide = true;
                }
            } else if (elapsed <= maxDuration) {
                let h = Math.floor(elapsed / 3600000); 
                let m = Math.floor((elapsed % 3600000) / 60000); 
                let s = Math.floor((elapsed % 60000) / 1000); 
                timerEl.className = "timer text-red"; 
                timerEl.innerHTML = `<div class="dot"></div> Live | Playing ${h}h ${m}m ${s}s`; 
            } else { 
                let finishExcess = elapsed - maxDuration;
                if (finishExcess <= hideBufferTime) {
                    timerEl.className = "timer"; 
                    timerEl.innerText = "Finished"; 
                } else {
                    shouldHide = true; // খেলা শেষ হওয়ার ২ ঘণ্টা পর অটো হাইড
                }
            }
        } else { 
            // এখানে ৩০ ঘন্টার লিমিট শর্তটি পুরোপুরি বাদ দেওয়া হয়েছে, ফলে সব আপকামিং ম্যাচ দেখাবে
            let h = Math.floor(diff / 3600000); 
            let m = Math.floor((diff % 3600000) / 60000); 
            let s = Math.floor((diff % 60000) / 1000); 

            if (h > 24) {
                let days = Math.floor(h / 24);
                let remHours = h % 24;
                timerEl.className = "timer text-orange";
                timerEl.innerText = `Start in: ${days}d ${remHours}h`;
            } else if (h >= 1) {
                timerEl.className = "timer text-orange";
                timerEl.innerText = `Start in: ${h}h ${m}m`;
            } else {
                timerEl.className = "timer text-green";
                timerEl.innerText = `Start in: ${h}h ${m}m ${s}s`;
            }
        } 

        if (!league.includes('TEST') && diff < 0 && elapsed > (maxDuration + hideBufferTime)) {
            shouldHide = true;
        }

        if (shouldHide) {
            card.style.display = "none";
        } else {
            card.style.display = "block";
            visibleCount++;
        }
    });

    if (liveWrapper && currentSearch === '') {
        liveWrapper.style.display = visibleCount > 0 ? "block" : "none";
    }
} 

function sendData(url) { 
    if (window.AppInventor) window.AppInventor.setWebViewString(url); 
    else if (window.CustomWebView) window.CustomWebView.setWebViewString(url); 
    else window.WebViewString = url; 
}
</script>



<script>
"use strict";

const JSON_URL =
"https://raw.githubusercontent.com/raselmia9/SNTT-ALL-DATA/refs/heads/main/Popular%20movie.json";

// কনফিগারেশন: গ্রিডে প্রতি লাইনে কয়টি কার্ড দেখতে চান
let gridColumns = 3; 

const grid = document.getElementById("movieGrid");
const modal = document.getElementById("movieModal");
const modalBox = document.getElementById("modalBox");

let movies = [];
let currentView = "grid";

/* BODY SCROLL LOCK */

let savedScrollPosition = 0;
let bodyScrollLocked = false;

function lockBodyScroll() {
  if (bodyScrollLocked) return;
  savedScrollPosition = window.pageYOffset || document.documentElement.scrollTop || 0;
  bodyScrollLocked = true;
  document.body.style.position = "fixed";
  document.body.style.top = "-" + savedScrollPosition + "px";
  document.body.style.left = "0";
  document.body.style.right = "0";
  document.body.style.width = "100%";
  document.documentElement.style.overflow = "hidden";
}

function unlockBodyScroll() {
  if (!bodyScrollLocked) return;
  bodyScrollLocked = false;
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.left = "";
  document.body.style.right = "";
  document.body.style.width = "";
  document.documentElement.style.overflow = "";
  window.scrollTo(0, savedScrollPosition);
}

/* LOAD JSON */

async function loadMovies() {
  try {
    const response = await fetch(JSON_URL, { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("Invalid JSON format");

    movies = data.filter(item =>
      item &&
      typeof item.title === "string" &&
      typeof item.img === "string" &&
      typeof item.link === "string"
    );

    allMovieItems = movies.slice();
    renderMovies();
    hideLoader();
  } catch(error) {
    grid.innerHTML = '<div class="empty">Unable to load movies.<br>Check your internet connection.</div>';
    console.error("Movie loading error:", error);
    hideLoader();
  }
}

/* MULTI-LINK PARSER */

function parseVideoLinks(raw) {
  if (!raw || typeof raw !== "string") return [];
  const input = raw.trim();
  if (!input) return [];

  const results = [];
  const parts = input.split(/\s*,\s*\)\s*/);

  parts.forEach((part, index) => {
    part = part.trim();
    if (!part) return;
    const separator = part.indexOf(",,");

    if (separator !== -1) {
      const label = part.substring(0, separator).trim();
      const url = part.substring(separator + 2).trim();
      if (/^https?:\/\//i.test(url)) {
        results.push({ label: label || ("Watch " + (index + 1)), rawUrl: url });
      }
    } else {
      if (/^https?:\/\//i.test(part)) {
        results.push({ label: "Watch Now", rawUrl: part });
      }
    }
  });

  if (results.length === 0 && /^https?:\/\//i.test(input)) {
    results.push({ label: "Watch Now", rawUrl: input });
  }
  return results;
}

/* EXTRACT VIDEO URL */

function parseVideoURL(raw) {
  const parts = raw.split("|");
  const videoUrl = parts[0].trim();
  return { videoUrl };
}

/* APPLY VIEW */

function applyView() {
  if (currentView === "grid") {
    grid.classList.remove("list-view");
    grid.style.setProperty("--columns", gridColumns);
    document.documentElement.style.setProperty("--columns", gridColumns);
  } else {
    grid.classList.add("list-view");
  }
}

/* RENDER MOVIES */

let allMovieItems = [];

// Called by filterMatches() whenever the app search box changes
function applyMovieSearch(input) {
  const q = (input || "").toLowerCase().trim();
  movies = q
    ? allMovieItems.filter(m => (m.title + " " + (m.details || "")).toLowerCase().includes(q))
    : allMovieItems.slice();
  renderMovies();
};

function renderMovies() {
  if (!movies.length) {
    grid.innerHTML = '<div class="empty">No movies found.</div>';
    return;
  }

  grid.innerHTML = "";
  const fragment = document.createDocumentFragment();

  movies.forEach((movie, originalIndex) => {
    const links = parseVideoLinks(movie.link);

    const card = document.createElement("div");
    card.className = "movie-card";

    const poster = document.createElement("div");
    poster.className = "poster";

    const img = document.createElement("img");
    img.src = movie.img;
    img.alt = movie.title;
    img.loading = "lazy";
    img.onerror = function() { this.style.opacity = "0"; };

    const overlay = document.createElement("div");
    overlay.className = "poster-overlay";

    const play = document.createElement("div");
    play.className = "play-icon";
    play.textContent = "▶";

    const tag = document.createElement("div");
    tag.className = "quality-tag";
    tag.textContent = links.length > 1 ? links.length + " OPTIONS" : "PLAY";

    poster.append(img, overlay, play, tag);

    const info = document.createElement("div");
    info.className = "movie-info";

    const title = document.createElement("div");
    title.className = "movie-title";
    title.textContent = movie.title;

    const desc = document.createElement("div");
    desc.className = "movie-desc";
    desc.textContent = movie.details || "";

    const date = document.createElement("div");
    date.className = "movie-date";
    date.textContent = movie.date || "Popular";

    info.append(title, desc, date);
    card.append(poster, info);

    card.addEventListener("click", () => {
      openMovie(originalIndex);
    });

    fragment.appendChild(card);
  });

  grid.appendChild(fragment);
  applyView();
}

/* GRID BUTTON */

document.getElementById("gridBtn").addEventListener("click", function() {
  currentView = "grid";
  this.classList.add("active");
  document.getElementById("listBtn").classList.remove("active");
  applyView();
});

/* LIST BUTTON */

document.getElementById("listBtn").addEventListener("click", function() {
  currentView = "list";
  this.classList.add("active");
  document.getElementById("gridBtn").classList.remove("active");
  applyView();
});

/* OPEN MOVIE */

function openMovie(index) {
  const movie = movies[index];
  if (!movie) return;

  const links = parseVideoLinks(movie.link);

  document.getElementById("detailPoster").src = movie.img;
  document.getElementById("detailTitle").textContent = movie.title;
  document.getElementById("detailDate").textContent = movie.date || "";
  document.getElementById("detailLinkCount").textContent = links.length + " Available Option(s)";
  document.getElementById("detailDescription").textContent = movie.details || "No additional information available.";

  const options = document.getElementById("videoOptions");
  options.innerHTML = "";

  links.forEach((link) => {
    const button = document.createElement("button");
    button.className = "video-option";

    const name = document.createElement("span");
    name.textContent = link.label;

    const action = document.createElement("span");
    action.textContent = "WATCH ▶";

    button.append(name, action);
    button.addEventListener("click", () => {
      selectMovie(movie, link);
    });
    options.appendChild(button);
  });

  if (!links.length) {
    options.textContent = "No valid video links available.";
  }

  modal.classList.add("show");
  lockBodyScroll();
  modalBox.scrollTop = 0;
}

/* SEND SELECTED VIDEO TO ANDROID */

function selectMovie(movie, selectedLink) {
  const parsed = parseVideoURL(selectedLink.rawUrl);
  const selectedLabel = String(selectedLink.label || "").trim();
  const finalTitle = selectedLabel && selectedLabel !== "Watch Now"
    ? (movie.title || "") + " - " + selectedLabel
    : (movie.title || "");

  const payload = {
    title: finalTitle,
    thumbnail: movie.img || "",
    videoUrl: parsed.videoUrl
  };

  const output = JSON.stringify(payload);

  try {
    if (window.AppInventor && typeof window.AppInventor.setWebViewString === "function") {
      window.AppInventor.setWebViewString(output);
    }
  } catch(error) {
    console.error("Android bridge error:", error);
  }

  window.dispatchEvent(new CustomEvent("movieSelected", { detail: payload }));
  window.lastSelectedMovie = payload;
  closeModal();
}

/* CLOSE MODAL */

function closeModal() {
  modal.classList.remove("show");
  unlockBodyScroll();
}

document.getElementById("closeModal").addEventListener("click", closeModal);

modal.addEventListener("click", function(event) {
  if (event.target === modal) {
    closeModal();
  }
});

/* PREVENT BACKGROUND TOUCH SCROLL */

modal.addEventListener("touchmove", function(event) {
  if (!modalBox.contains(event.target)) {
    event.preventDefault();
  }
}, { passive: false });

/* ESCAPE KEY */

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeModal();
  }
});

/* START */

loadMovies();

/* EXTERNAL API */

window.MovieHub = {
  reload: loadMovies,
  getMovies: () => movies,
  getSelectedMovie: () => window.lastSelectedMovie || null,
  getVideoLinks: (index) => movies[index] ? parseVideoLinks(movies[index].link) : []
};

</script>
